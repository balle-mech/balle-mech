name: Update LAPRAS card

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 9:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kawamataryo/lapras-card-readme@main
        with:
          SHARE_ID: KKNCVCX
